# ---------------------------------------------------------------------------
# Kesseltyp PELLET – Schnecken-Stroeme und Betriebsstunden
# Einbinden: in der Geraete-YAML unter packages -> files: pellet.yaml
#   zusammen mit allgemein.yaml und austragung.yaml (Pelletsbehaelter, Lager, Verbrauch)
#   NICHT gleichzeitig mit hackgut.yaml
# Register laut Fröling "ModBus Lambdatronic 3200" (B1200419), Adresse = ID - 30001
# ---------------------------------------------------------------------------
sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stromaufnahme der Stokerschnecke"
    id: ${name}_Stromaufnahme_der_Stokerschnecke
    register_type: read
    address: 31          # 30032
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Stromaufnahme der Zellradschleuse"
    id: ${name}_Stromaufnahme_der_Zellradschleuse
    register_type: read
    address: 30          # 30031
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${name} Betriebsstunden Stokerschnecke"
    id: ${name}_Betriebsstunden_Stokerschnecke
    register_type: read
    address: 39          # 30040
    unit_of_measurement: "h"
    state_class: total_increasing
    value_type: U_WORD
